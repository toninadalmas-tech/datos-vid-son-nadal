# ══════════════════════════════════════════════════════════════════
#  GitHub Actions - Recollida diària Son Nadal (Oïdi vid)
#  S'executa cada matí a les 07:00 hora de Mallorca (05:00 UTC)
#  També es pot llançar manualment des de GitHub > Actions > Run workflow
# ══════════════════════════════════════════════════════════════════

name: Recollida diaria Son Nadal

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  colleccio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la dependències
        run: pip install requests beautifulsoup4 pandas numpy

      - name: Executa el col·lector
        run: python son_nadal_collector.py

      - name: Executa el model de mildiu
        run: python mildiu_collector.py

      - name: Descarrega dades d'Open-Meteo
        run: python fetch_openmeteo.py

      - name: Genera el dashboard HTML
        run: python generate_dashboard.py

      - name: Puja CSV i dashboard al repositori
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historial.csv data/mildiu_historial.csv docs/
          git diff --cached --quiet || git commit -m "dades: $(date +'%Y-%m-%d') actualitzat"
          git push
