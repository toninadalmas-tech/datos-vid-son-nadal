# ══════════════════════════════════════════════════════════════════
#  GitHub Actions - Recollida diària Son Nadal (Oïdi vid)
#  S'executa cada matí a les 07:00 hora de Mallorca (05:00 UTC)
#  També es pot llançar manualment des de GitHub > Actions > Run workflow
# ══════════════════════════════════════════════════════════════════

name: Recollida diària Son Nadal

on:
  schedule:
    # Cada dia a les 05:00 UTC = 07:00 hora Mallorca (hivern)
    # Ajusta a 04:00 UTC a l'estiu (06:00 UTC+2) si vols
    - cron: "0 5 * * *"
  workflow_dispatch:   # permet llançar manualment

jobs:
  colleccio:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessari per fer push del CSV

    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la dependències
        run: pip install requests beautifulsoup4 pandas numpy

      - name: Executa el col·lector
        run: python son_nadal_collector.py

      - name: Puja el CSV actualitzat al repositori
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historial.csv
          git diff --cached --quiet || git commit -m "dades: $(date +'%Y-%m-%d') Son Nadal actualitzat"
          git push
